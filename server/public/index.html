<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quản lý thu chi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23ffd84d'/%3E%3Cg transform='translate(0 4)' stroke='%2322201c' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='11' y='29' width='6' height='8' rx='2' fill='%23f7a8b3'/%3E%3Crect x='27' y='29' width='6' height='8' rx='2' fill='%23f7a8b3'/%3E%3Cellipse cx='22' cy='22' rx='17' ry='13' fill='%23ffd3de'/%3E%3Cpath d='M28 10l3-7 5 8' fill='%23f7a8b3'/%3E%3Crect x='36' y='17' width='9' height='11' rx='4' fill='%23ffc2cc'/%3E%3Cpath d='M17 9.5h9' stroke-width='3'/%3E%3C/g%3E%3Ccircle cx='32' cy='23' r='1.8' fill='%2322201c'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#efe6d2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#25211b" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thu chi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Bộ lọc nhòe nét (cho đường vẽ tay) và mẫu tô sọc; màu của mẫu tô lấy từ biến CSS nên đổi theo chế độ sáng/tối -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute">
    <defs>
      <filter id="nhoe" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
      <filter id="nhoe-nho" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.3"/></filter>
      <filter id="nhoe-heo" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
      <filter id="nhoe-hu" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
      <pattern id="soc-thu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="soc-nen" width="7" height="7"/><line class="soc-net" x1="0" y1="0" x2="0" y2="7" stroke-width="2"/></pattern>
    </defs>
  </svg>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
